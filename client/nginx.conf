server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Built files have a hash in their name, so they never change: cache them for a year.
  # A missing file is a real 404 (not index.html), so an old browser tab cannot get HTML
  # where it expects a script.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # React Router: every other path gets index.html. It must not be cached, so a new
  # deployment is picked up at once.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
